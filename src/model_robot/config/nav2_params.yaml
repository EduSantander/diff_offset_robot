controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      # SUBIDO a ~pi: la orientacion del CHASIS ya no es parte de la
      # mision (eso ahora lo resuelve platform_orientation_controller
      # sobre theta_p, de forma independiente). El goal checker de Nav2
      # solo debe exigir posicion.
      yaw_goal_tolerance: 3.15
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      min_vel_x: -0.3
      max_vel_x: 0.4
      min_vel_y: -0.12
      max_vel_y: 0.12
      max_vel_theta: 1.8
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0

      acc_lim_x: 1.0
      acc_lim_y: 1.4
      acc_lim_theta: 3.5
      decel_lim_x: -1.0
      decel_lim_y: -1.4
      decel_lim_theta: -3.5

      vx_samples: 15
      vy_samples: 8
      vtheta_samples: 20

      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: false
      limit_vel_cmd_in_traj: false

      # Sin RotateToGoal (nunca tuvo sentido para esta cinematica) y
      # ahora tampoco necesitamos que PathAlign/GoalAlign se esfuercen
      # tanto en orientacion del chasis -- solo posicion importa.
      # RotateToGoal ya no aplica (chasis solo posiciona). BaseObstacle
      # SUBIDO drasticamente: en 0.02 era ~1000x mas debil que los
      # criticos de seguimiento de camino, asi que casi nunca ganaba --
      # el robot seguia de largo hasta chocar. Con un peso comparable,
      # el controlador SI puede preferir frenar/retroceder/desviarse
      # cuando hay un obstaculo cerca, en vez de solo perseguir el plan.
      critics: ["Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 24.0
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 24.0
      GoalDist.scale: 24.0

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      # REVERTIDO de SmacPlannerHybrid a NavfnPlanner: ya no necesitamos
      # curvas conscientes de orientacion final (Dubin/Reeds-Shepp,
      # radio de giro minimo). El chasis solo posiciona -- un
      # planificador de rejilla simple es mas liviano y es exactamente
      # lo que corresponde ahora.
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.33
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.33
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.55
      always_send_full_costmap: true